defaults:
  - mode: dev # dev or train
  - optimizer: adam_atan2
  - override hydra/launcher: cluster_config
  - _self_

seed: 0
device: cuda
num_workers: 8

# Data
data_dir: data
experiment_name: ${mode.mode}mode_run_lr${optimizer.lr}_seed${seed}
output_dir: experiments/${experiment_name}

# Weights and Biases (used for logging)
wandb:
  enabled: true
  project: nn_optimization_similarity
  mode: offline

# Hydra (used for output)
hydra:
  run:
    dir: ${output_dir}